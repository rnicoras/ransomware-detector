<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ransomware Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="header">
    <h1>Ransomware Detector</h1>
    <span class="sub">Threat monitoring dashboard</span>
</div>

<div class="container">
    <div class="stats">
        <div class="stat">
            <span class="stat-label">Alerts</span>
            <span class="stat-val" id="sAlerts">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Suspensions</span>
            <span class="stat-val" id="sSuspend">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Quarantines</span>
            <span class="stat-val" id="sQuarantine">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Uptime</span>
            <span class="stat-val" id="sUptime">00:00:00</span>
        </div>
    </div>

    <div class="feed">
        <div class="feed-top">
            <span class="feed-title">Event Feed</span>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
        <div class="table-wrap" id="wrap">
            <div class="empty" id="empty">No threats detected.</div>
            <table id="tbl" style="display:none">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Level</th>
                        <th>Score</th>
                        <th>File</th>
                        <th>Signals</th>
                        <th>PID</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/static/socket.js"></script>
</body>
</html>
